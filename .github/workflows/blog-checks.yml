name: Blog checks
on:
  push:
    branches: [main, 'devrel/technical-blog', 'maintenance/**']
  pull_request:
    paths: ['public/**', 'docs/**', 'index.html', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'vite.config.ts', 'scripts/**', 'tests/**', '.github/workflows/blog-checks.yml', '.github/workflows/published-blog-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check pages, resources, sitemap and mirror
        run: python scripts/check_blog.py
      - name: Verify checks also work in optimized mode
        run: python -O scripts/check_blog.py
      - name: Check domain and homepage preservation
        run: python -O scripts/check_publication.py
      - name: Test the verifiers
        run: python -m unittest discover -s tests -v
      - name: Reproduce both examples and check input preservation
        run: python public/blog/exemplos/run_examples.py
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install the repository's package manager
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check and build the actual portfolio
        run: pnpm build
      - name: Verify clean build preserves the blog and domain
        run: |
          python3 -B scripts/check_blog.py
          python3 -B scripts/check_publication.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser test dependency
        run: python -m pip install playwright==1.57.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test navigation, language, anchors and downloads
        run: python scripts/check_blog_browser.py
