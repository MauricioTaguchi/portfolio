name: English delivery preparation
on:
  push:
    branches: ['content/english-portfolio']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive tracked source for review
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/portfolio-source.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: portfolio-source-review
          path: ${{ runner.temp }}/portfolio-source.zip
          retention-days: 1
