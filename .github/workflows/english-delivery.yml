name: English delivery preparation
on:
  push:
    branches: ['content/english-portfolio']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/content/english-portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: content/english-portfolio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply the reviewed source revision
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts=[Path(f'.delivery/english-source.part{i}') for i in (1,2,3)]
          if not all(p.is_file() for p in parts):
              raise SystemExit('The reviewed revision is not available.')
          compressed=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          if hashlib.sha256(compressed).hexdigest()!='3fa74cc59fdcf02488d5530cbc4ca2472784a32a7e8899bfd3166b6cd6d97539':
              raise SystemExit('Revision checksum mismatch.')
          revision=json.loads(lzma.decompress(compressed))
          if len(revision)!=31:
              raise SystemExit('Unexpected file inventory.')
          prepared=[]
          for name,spec in revision.items():
              path=Path(name)
              allowed=name.startswith(('src/','public/blog/','scripts/','tests/','content/')) or name in {'README.md','BLOG_MAINTENANCE.md','index.html'}
              if not allowed or path.is_absolute() or '..' in path.parts or path.is_symlink():
                  raise SystemExit('Unexpected path: '+name)
              if 'sha256' in spec:
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=spec['sha256']:
                      raise SystemExit('Source changed: '+name)
              elif path.exists():
                  raise SystemExit('New path already exists: '+name)
              if 'content' in spec:
                  text=spec['content']
              else:
                  text=path.read_text(encoding='utf-8')
                  last=len(text)+1
                  for start,end,replacement in reversed(spec['edits']):
                      if not 0<=start<=end<last:
                          raise SystemExit('Invalid edit range: '+name)
                      text=text[:start]+replacement+text[end:]
                      last=start+1
              prepared.append((path,text))
          for path,text in prepared:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8')
          print('Applied',len(prepared),'reviewed source files.')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install locked build and review tools
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          python -m pip install python-pptx==1.0.2 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Generate public downloads and build the portfolio
        run: |
          python -B scripts/build_learning_resources.py
          pnpm build
      - name: Validate the English source and examples
        run: |
          python -B scripts/check_blog.py
          python -B scripts/check_publication.py
          python -B -m unittest discover -s tests -v
          python -B public/blog/exemplos/run_examples.py
      - name: Exercise English navigation and all public downloads
        run: |
          python -B scripts/check_blog_browser.py --screenshots "$RUNNER_TEMP/english-evidence/blog"
          python -B scripts/check_portfolio_browser.py --evidence-dir "$RUNNER_TEMP/english-evidence/portfolio"
      - name: Commit only the reviewed source and generated publication
        run: |
          test "$(git branch --show-current)" = 'content/english-portfolio'
          git config user.name 'Portfolio maintenance'
          git config user.email '260479876+MauricioTaguchi@users.noreply.github.com'
          git add src public docs content scripts tests README.md BLOG_MAINTENANCE.md index.html
          git rm .delivery/english-source.part1 .delivery/english-source.part2 .delivery/english-source.part3
          git commit -m "Publish English portfolio, articles and verified learning downloads"
          git push origin HEAD:refs/heads/content/english-portfolio
          git archive --format=zip HEAD -o "$RUNNER_TEMP/english-source.zip"
      - name: Retain reviewed source and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: english-delivery-evidence
          path: |
            ${{ runner.temp }}/english-evidence
            ${{ runner.temp }}/english-source.zip
          retention-days: 7
          if-no-files-found: warn
