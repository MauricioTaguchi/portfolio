name: TM branding preparation
on:
  push:
    branches: [branding/tm-monogram]
    paths: ['.github/workflows/tm-branding-preparation.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/branding/tm-monogram'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: branding/tm-monogram
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Update only the site monogram and its generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          evidence=Path(os.environ['RUNNER_TEMP'])/'tm-evidence';evidence.mkdir()
          old,new='>MT<span>','>TM<span>'
          sources=[Path('src/portfolio.tsx'),Path('scripts/build_hiring_resources.py')]
          pages=[p for p in Path('public').rglob('*.html') if old in p.read_text()]
          if len(pages)!=11 or sources[0].read_text().count(old)!=3 or sources[1].read_text().count(old)!=1:
              raise SystemExit('Unexpected branding inventory; inspect the changed source before proceeding.')
          downloads={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('public').rglob('*') if p.suffix in {'.pdf','.pptx','.zip'}}
          for p in sources+pages:
              p.write_text(p.read_text().replace(old,new),encoding='utf-8')
          icon=Path('public/favicon.svg')
          previous='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#3148f6"/><path d="M11 44V20h5l9 13 9-13h5v24h-6V30l-8 11-8-11v14zm31-24h16v6h-5v18h-6V26h-5z" fill="#fff"/></svg>'
          if icon.read_text().strip()!=previous:raise SystemExit('Unexpected favicon source')
          icon.write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TM"><title>TM</title><rect width="64" height="64" rx="12" fill="#3148f6"/><path d="M11 20h16v6h-5v18h-6V26h-5z" fill="#fff"/><path d="M30 44V20h5l9 13 9-13h5v24h-6V30l-8 11-8-11v14z" fill="#fff"/></svg>\n')
          (evidence/'scope.json').write_text(json.dumps({'updated_pages':[str(p) for p in pages],'download_sha256':downloads},indent=2))
          Path('tests/test_branding.py').write_text('''"""Keep the requested site monogram consistent without changing personal names."""
          from pathlib import Path
          import unittest
          import xml.etree.ElementTree as ET
          ROOT=Path(__file__).resolve().parents[1]
          class BrandingTests(unittest.TestCase):
              def test_portfolio_wordmarks(self):
                  source=(ROOT/'src/portfolio.tsx').read_text()
                  self.assertEqual(source.count('>TM<span>'),3)
                  self.assertNotIn('>MT<span>',source)
                  self.assertIn('Maurício',source)
              def test_public_page_marks_and_mirror(self):
                  pages=[p for p in (ROOT/'public').rglob('*.html') if 'class="brand"' in p.read_text()]
                  self.assertEqual(len(pages),11)
                  for p in pages:
                      with self.subTest(page=str(p)):
                          self.assertIn('>TM<span>',p.read_text())
                          self.assertNotIn('>MT<span>',p.read_text())
                          self.assertEqual(p.read_bytes(),(ROOT/'docs'/p.relative_to(ROOT/'public')).read_bytes())
              def test_html_generator_preserves_monogram(self):
                  source=(ROOT/'scripts/build_hiring_resources.py').read_text()
                  self.assertIn('>TM<span>',source)
                  self.assertNotIn('>MT<span>',source)
              def test_favicon_and_mirror(self):
                  icon=ROOT/'public/favicon.svg'
                  self.assertEqual(ET.fromstring(icon.read_text()).get('aria-label'),'TM')
                  self.assertEqual(icon.read_bytes(),(ROOT/'docs/favicon.svg').read_bytes())
          ''')
          PY
      - name: Install locked dependencies and build
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm build
      - name: Verify source, publication and unchanged downloads
        run: |
          python -B -m unittest discover -s tests -v
          python -B scripts/check_blog.py
          python -B scripts/check_publication.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          scope=json.loads((Path(os.environ['RUNNER_TEMP'])/'tm-evidence/scope.json').read_text())
          for name,digest in scope['download_sha256'].items():
              p=Path(name)
              if hashlib.sha256(p.read_bytes()).hexdigest()!=digest or p.read_bytes()!=(Path('docs')/p.relative_to('public')).read_bytes():raise SystemExit('Download changed: '+name)
          print('Existing PDF, slides and ZIP downloads remain byte-identical.')
          PY
      - name: Verify rendered portfolio and TM marks
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -B scripts/check_portfolio_browser.py --evidence-dir "$RUNNER_TEMP/tm-evidence/portfolio"
          python - <<'PY'
          from pathlib import Path
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from threading import Thread
          import json,os
          from playwright.sync_api import sync_playwright,expect
          evidence=Path(os.environ['RUNNER_TEMP'])/'tm-evidence'
          scope=json.loads((evidence/'scope.json').read_text())
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(SimpleHTTPRequestHandler,directory='docs'))
          Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}/'
          results=[]
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch()
                  for width,height in [(1440,1000),(390,844)]:
                      context=browser.new_context(viewport={'width':width,'height':height},reduced_motion='reduce')
                      page=context.new_page();errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      page.goto(base,wait_until='networkidle')
                      expect(page.locator('.site-header .wordmark').first).to_have_text('TM.')
                      expect(page.locator('footer .wordmark')).to_have_text('TM.')
                      page.screenshot(path=str(evidence/f'{width}-tm-home.png'))
                      if width<600:
                          page.get_by_role('button',name='Open menu',exact=True).click()
                          expect(page.locator('.mobile-menu .wordmark')).to_have_text('TM.')
                          page.screenshot(path=str(evidence/f'{width}-tm-menu.png'))
                          page.keyboard.press('Escape')
                      for name in scope['updated_pages']:
                          page.goto(base+str(Path(name).relative_to('public')),wait_until='networkidle')
                          expect(page.locator('.brand')).to_have_text('TM.')
                          if 'blog/index.html' in name:page.screenshot(path=str(evidence/f'{width}-tm-blog.png'))
                      if errors:raise RuntimeError(errors)
                      results.append({'viewport':f'{width}x{height}','status':'passed','page_marks':len(scope['updated_pages']),'runtime_errors':errors})
                      context.close()
                  browser.close()
              (evidence/'branding-results.json').write_text(json.dumps(results,indent=2))
          finally:server.shutdown();server.server_close()
          PY
      - name: Commit verified content to the feature branch
        run: |
          git add src/portfolio.tsx scripts/build_hiring_resources.py public docs tests/test_branding.py
          git config user.name 'Maurício Ryo Toita Taguchi'
          git config user.email 'mauricioryotoitataguchi@gmail.com'
          git commit -m 'Use TM for the portfolio site monogram and favicon'
          git push origin HEAD:branding/tm-monogram
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tm-branding-review
          path: ${{ runner.temp }}/tm-evidence
          retention-days: 7
